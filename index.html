    <script>
      (function() {
        // Robust base URL detection (works with /php_version/, /php_version/index.php, subdomains, and root)
        let base = (typeof window.__APP_BASE__ === 'string') ? window.__APP_BASE__ : undefined;
        if (base === undefined) {
          const p = window.location.pathname;
          // Strip index.php / index.html or trailing slash
          base = p.replace(/\/[^\/]*\.[a-zA-Z0-9]+$/, '').replace(/\/$/, '');
        }
        window.__APP_BASE__ = base || '';

        // Intercept fetch calls to ensure /api/ requests target the correct base path
        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
          if (typeof input === 'string' && input.startsWith('/api/')) {
            const prefix = (window.__APP_BASE__ || '').replace(/\/$/, '');
            input = prefix + input;
          }
          return originalFetch.call(this, input, init);
        };
      })();
    </script>
