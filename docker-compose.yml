version: '3.8'

services:
  expense-tracker-kali:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-tracker-server
    restart: unless-stopped
    ports:
      - "16001:3000"   # Expense Tracker Web Application & REST API
      - "16000:22"     # OpenSSH Access into Kali Linux Container
    volumes:
      # Persistent SQLite database in current host folder
      - ./data:/app/data
      # Live Source Code Mounts - enables INSTANT updates without rebuilding Docker image!
      - ./dist:/app/dist
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./server.ts:/app/server.ts
      - ./entrypoint.sh:/app/entrypoint.sh
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DEV_MODE=true
      - SSH_USER=kali
      - SSH_PASSWORD=kali
