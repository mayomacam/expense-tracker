name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments mutating the production branch simultaneously
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-php:
    name: Validate PHP Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, json, mbstring

      - name: Validate PHP syntax
        run: |
          php -l index.php
          find api config src -name "*.php" -exec php -l {} +

  build-and-deploy:
    name: Build & Deploy JS Bundle
    runs-on: ubuntu-latest
    needs: validate-php

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js_version/package-lock.json

      - name: Install dependencies
        working-directory: js_version
        run: npm ci

      - name: Run code & type checks
        working-directory: js_version
        run: npm run lint

      - name: Build web frontend assets
        working-directory: js_version
        run: npm run build

      - name: Prepare production release bundle
        run: |
          mkdir -p prod-release
          # 1. Pre-built frontend assets
          cp -r js_version/dist prod-release/dist
          # 2. Server and source code required by runtime
          cp js_version/server.ts prod-release/server.ts
          cp js_version/package.json prod-release/package.json
          cp js_version/package-lock.json prod-release/package-lock.json
          cp js_version/tsconfig.json prod-release/tsconfig.json
          cp -r js_version/src prod-release/src
          # 3. Docker deployment configurations
          cp js_version/Dockerfile prod-release/Dockerfile
          cp js_version/docker-compose.yml prod-release/docker-compose.yml
          cp js_version/.dockerignore prod-release/.dockerignore
          # 4. Production gitignore (keeps dist/ tracked, ignores node_modules and data/)
          cat << 'EOF' > prod-release/.gitignore
          node_modules
          data
          .env
          *.log
          EOF
          # 5. Production README
          cp js_version/README.md prod-release/README.md

      - name: Deploy release bundle to production branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: production
          folder: prod-release
          clean: true
          commit-message: "deploy: automated production release bundle [skip ci]"
