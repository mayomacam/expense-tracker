version: '3.8'

services:
  expense-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: expense-tracker:latest
    container_name: expense-tracker-server
    restart: unless-stopped
    ports:
      - "16001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/db/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
